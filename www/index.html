<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <title>BuildTogether</title>
    <style>
      :root {
        color-scheme: dark;
        --navy-950: #080f1c;
        --brand-500: #6d4aff;
        --text: #eef1f7;
        --muted: #97a3b8;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(1200px 600px at 50% -10%, #1a2440 0%, var(--navy-950) 60%);
        color: var(--text);
        font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card { max-width: 360px; }
      .mark {
        width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 16px;
        background: linear-gradient(135deg, var(--brand-500), #23c4a7);
        display: grid; place-items: center; font-weight: 700; font-size: 22px; color: #fff;
      }
      h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: -0.2px; }
      p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
      a {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: 44px; padding: 0 20px; border-radius: 12px;
        background: var(--brand-500); color: #fff; text-decoration: none; font-weight: 600;
      }
      @media (prefers-reduced-motion: no-preference) {
        .mark { animation: settle 600ms cubic-bezier(0.2, 0.7, 0.2, 1) both; }
        @keyframes settle { from { opacity: 0; transform: translateY(6px) scale(0.96); } to { opacity: 1; transform: none; } }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">BT</div>
      <h1>BuildTogether</h1>
      <p id="status">Opening the app… If nothing happens, the deployment may be unreachable.</p>
      <a id="open" href="https://buildtogether-e6cb.onrender.com">Open BuildTogether</a>
    </main>
    <script>
      // The native shell loads the deployed app directly; this page is only what a user sees
      // if that load fails, so it offers an explicit retry instead of a blank screen.
      var target = "https://buildtogether-e6cb.onrender.com";
      document.getElementById("open").href = target;
      setTimeout(function () {
        document.getElementById("status").textContent = "Still not connected. Check your network, then tap below.";
      }, 4000);
    </script>
  </body>
</html>
