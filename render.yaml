# Render blueprint for BuildTogether.
#
# This app keeps its data in SQLite plus a local media folder, so it needs a persistent
# disk. Render only offers disks on paid service types: the free web service plan has an
# ephemeral filesystem and would lose every account and upload on each deploy or restart.
#
# Create via Dashboard → New → Blueprint, pointing at this repository. Then set
# NEXT_PUBLIC_APP_URL to the service's public URL (Render prompts for it, because it is
# not known until the service exists) and redeploy, so the value is present at build time.
#
# One service, one disk: Render attaches a single disk per service, so the database and the
# uploads share it (/app/data/buildtogether.db and /app/data/storage).

services:
  - type: web
    name: buildtogether
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    # Do not set dockerCommand here. Render passes it through as a single argument to `sh -c`,
    # so a quoted pipeline (with && and parentheses) fails at boot with exit 127 and every
    # deploy silently rolls back to the previous container. The image's exec-form CMD in
    # ./Dockerfile carries the migrate → seed → start sequence instead.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: DATABASE_PATH
        value: /app/data/buildtogether.db
      - key: STORAGE_LOCAL_DIR
        value: /app/data/storage
      - key: STORAGE_DRIVER
        value: local
      - key: EMAIL_PROVIDER
        value: console
      # Demonstration deployment: seed the fictional dataset once, on a brand-new volume.
      # Seeding stops for good as soon as the database holds any account.
      - key: DEMO_MODE
        value: "1"
      # One-shot reset for this demonstration site: deletes the demo database and uploads,
      # then reseeds. A marker file records that it ran, so leaving this set cannot erase
      # data again. Remove it once the site shows the demo data.
      - key: DEMO_RESET
        value: "1"
      - key: PAYMENTS_ENABLED
        value: "false"
    disk:
      name: buildtogether-data
      mountPath: /app/data
      sizeGB: 1
